body{font-family:'Cinzel','Cormorant Garamond',Georgia,serif;color:#ecd2b8;display:flex;justify-content:center}
.card{position:relative;z-index:1;width:100%;max-width:420px;height:calc(100% - 38px);align-self:center;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:calc(2*var(--u)) 18px}
.m{background:var(--g);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8))}
@keyframes shine{to{background-position:-300% 0}}
.grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,calc(1.5*var(--u)),14px) 14px}
.btn{display:block;text-decoration:none;padding:3px;border-radius:18px;background:var(--g);background-size:300% 100%;animation:shine 6s linear infinite;
 box-shadow:0 1px 0 #fff1dfcc inset,0 2px 0 #9a7358,0 4px 0 #6b4d38,0 6px 0 #42301f,0 11px 16px #000c;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 #fff1dfcc inset,0 1px 0 #6b4d38,0 3px 6px #000c}
.in{height:clamp(40px,calc(6.3*var(--u)),54px);border-radius:15px;display:flex;align-items:center;justify-content:center;gap:9px;
 background:linear-gradient(180deg,#34343a 0%,#121215 48%,#000 52%,#0b0b0d 100%);
 box-shadow:inset 0 2px 3px rgba(255,255,255,.2),inset 0 -3px 6px #000,inset 0 0 12px #000}
.t{font-weight:600;font-size:clamp(10px,calc(1.7*var(--u)),13px);letter-spacing:.14em;text-transform:uppercase}
.ic{width:clamp(16px,calc(2.6*var(--u)),22px);aspect-ratio:1;background:var(--g);background-size:300% 100%;animation:shine 6s linear infinite;
 -webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.order{width:80%}
.order .in{height:clamp(52px,calc(8.2*var(--u)),70px);gap:12px;justify-content:center}
.order .tx{display:flex;flex-direction:column;align-items:center;gap:calc(.5*var(--u))}
.order .l1{font-weight:600;font-size:clamp(13px,calc(2.2*var(--u)),17px);letter-spacing:.5em;padding-left:.5em}
.order .l2{font-size:clamp(7px,calc(1.15*var(--u)),9.5px);letter-spacing:.14em;font-weight:500}
.order .ic{width:clamp(22px,calc(3.6*var(--u)),30px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.logo{display:block;width:min(calc(41*var(--u)),82vw);aspect-ratio:1;object-fit:contain;}
.fw{position:fixed;z-index:1;pointer-events:none;left:50%;width:min(calc(100% - 16px),420px);transform:translateX(-50%) perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform;top:calc(env(safe-area-inset-top,0px) + 27px);bottom:calc(env(safe-area-inset-bottom,0px) + 27px);
 filter:drop-shadow(0 2px 0 #6b4d38) drop-shadow(0 4px 0 #42301f) drop-shadow(0 8px 12px #000)}
.fr{position:absolute;inset:0;border-radius:26px;padding:4px;background:var(--g);background-size:300% 100%;animation:shine 6s linear infinite;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.fr2{position:absolute;inset:9px;border-radius:20px;border:1px solid rgba(232,207,176,.5)}
.card{padding:calc(calc(2*var(--u)) + 12px) 28px}
.order{width:86%}
.order .in{position:relative;justify-content:center}
.order .ic{position:absolute;left:16px;width:clamp(24px,calc(3.9*var(--u)),32px)}
.order .tx{padding-left:22px}
.order .l2{font-size:clamp(9px,calc(1.5*var(--u)),12px);letter-spacing:.09em;white-space:nowrap}
.order .l1{font-size:clamp(14px,calc(2.3*var(--u)),18px)}
.logo{transform:translate3d(var(--px,0px),var(--py,0px),0)}
</style>
</head>
<body>
